name: Package Pitch for macOS
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Check signing credentials
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for field in CERT PASS KEY KEY_ID ISSUER; do
            if [[ -z "${!field}" ]]; then echo "::error::Missing Apple signing or notarization secret ($field)"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run build
      - name: Sign, notarize, staple and assess
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/package-mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pitch-macOS-${{ matrix.arch }}
          path: Pitch-macOS-*.zip
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" packages/*.zip --repo "$GITHUB_REPOSITORY" --title "Pitch for macOS $GITHUB_REF_NAME" --notes "Choose arm64 for Apple Silicon or x64 for Intel. Extract the ZIP and move Pitch.app to Applications."
        env:
          GH_TOKEN: ${{ github.token }}

